[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "livesubs"
dynamic = ["version"]
description = "Real-time, fully local English-to-Turkish game subtitle translation overlay for Windows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
authors = [{ name = "Mert" }]
keywords = ["ocr", "translation", "overlay", "subtitles", "ollama", "games", "windows"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Turkish",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]
dependencies = [
    "PySide6-Essentials>=6.8",
    "numpy>=2.1",
    # windows-capture depends on opencv-python; never add opencv-python-headless next to it.
    "opencv-python>=4.10",
    "windows-capture>=2.0,<3",
    "mss>=9.0",
    "winrt-runtime>=2.3",
    "winrt-Windows.Foundation>=2.3",
    "winrt-Windows.Foundation.Collections>=2.3",
    "winrt-Windows.Globalization>=2.3",
    "winrt-Windows.Graphics.Imaging>=2.3",
    "winrt-Windows.Media.Ocr>=2.3",
    "winrt-Windows.Storage.Streams>=2.3",
    "httpx>=0.27",
    "pydantic>=2.8",
    "rapidfuzz>=3.9",
    "qrcode>=8.0",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "respx>=0.21",
    "ruff>=0.8",
]
build = ["pyinstaller>=6.10"]

[project.gui-scripts]
livesubs = "livesubs.app:main"

[project.urls]
Repository = "https://github.com/MertCodur-0/LiveSubs"

[tool.setuptools.dynamic]
version = { attr = "livesubs.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
livesubs = ["**/*.json", "**/*.qss", "**/*.svg", "**/*.ttf", "**/*.html"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["livesubs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "ocr: requires the Windows en-US OCR language pack",
    "ollama: requires a running Ollama server",
    "capture: captures the real desktop (needs an interactive session)",
]
